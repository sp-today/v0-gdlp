services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - NODE_ENV=production
    depends_on:
      - postgres
    networks:
      - gdlp-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=gdlp
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gdlp-network

volumes:
  postgres_data:

networks:
  gdlp-network:
    driver: bridge
