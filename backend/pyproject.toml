[tool.poetry]
name = "gdlp-backend"
version = "0.1.0"
description = "Guardian Device Lifecycle Platform - FastAPI Backend"
authors = ["SP Today"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.103.0"
uvicorn = "^0.23.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = "^1.7.4"
python-multipart = "^0.0.6"
sqlalchemy = "^2.0.0"
asyncpg = "^0.28.0"
redis = "^5.0.0"
python-dotenv = "^1.0.0"
pydantic = "^2.4.0"
alembic = "^1.12.0"
psycopg2-binary = "^2.9.9"
httpx = "^0.25.0"
python-slugify = "^8.0.1"
aiofiles = "^23.2.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.5.1"
ruff = "^0.0.285"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true